spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-secret.yml

  main:
    web-application-type: servlet

  autoconfigure:
    # management.server.port 분리 시 자동으로 붙는 Basic Auth 비활성화 — 프로메테우스가
    # 인증 없이 스크랩하려면 필요하다. 대신 9092는 방화벽/내부망에서만 닿아야 한다.
    exclude: org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/community}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

jwt:
  # 메인 백엔드의 서명 공개키. 컨테이너 간 직접 조회라 nginx 노출이 필요 없다.
  jwks-uri: ${MAIN_BACKEND_JWKS:http://localhost:8090/.well-known/jwks.json}
  # HS 대칭키 검증 경로. 운영에서는 2026-08-02 에 주입을 끊었고(compose 참고), 값이 없으면
  # RS256 으로만 검증한다. 로컬 개발에서 메인 백엔드 없이 토큰을 흉내 낼 때만 쓰인다.
  secret: ${JWT_SECRET:}
  secret-encoding: ${JWT_SECRET_ENCODING:base64}

internal:
  api-token: ${INTERNAL_API_TOKEN:local-internal-token}

# 메인 백엔드(Backend-v2)의 내부 gRPC 서비스. 컨테이너 간 내부 통신이라 평문을 쓴다.
grpc:
  client:
    internal-user:
      address: ${MAIN_BACKEND_GRPC:static://localhost:9090}
      negotiation-type: plaintext
      # WatchUserChanges 는 몇 시간씩 열려 있는 스트림이라, 연결이 조용히 끊기면
      # (호스트 급사, 방화벽/conntrack 만료) 클라이언트는 끊긴 줄 모르고 onError 도 받지
      # 못해 재연결이 영영 안 걸린다. 핑으로 이 half-open 상태를 감지한다.
      # 5분은 gRPC 서버의 기본 permit-keep-alive-time 과 같은 값이다 — 더 짧게 잡으면
      # 서버가 ENHANCE_YOUR_CALM 으로 GOAWAY 를 보내 오히려 연결이 끊긴다.
      enable-keep-alive: true
      keep-alive-time: 5m
      keep-alive-timeout: 20s

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:community}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    com.planmate: DEBUG

server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

management:
  # 별도 포트로 분리 — server.port(8081)의 JWT 인증 필터가 적용되지 않는 독립 서블릿
  # 컨테이너가 뜬다. 9092는 내부망 전용이라 인증 없이 프로메테우스가 스크랩한다
  # (spring.autoconfigure.exclude로 자동 Basic Auth도 꺼둠 — Backend-v2 PR #21 참고).
  server:
    port: ${MANAGEMENT_SERVER_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: planmate-community

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
