# planmatetest(docker53, 192.168.0.53) — Backend-v2 스택 옆에 커뮤니티를 기동한다.
# 기존 planmate-v2 스택은 건드리지 않고, 같은 네트워크(planmate-v2_default)에 붙여
# planmate-postgres / planmate-app 를 컨테이너명으로 참조한다.
#
# Redis 는 더 이상 공유하지 않는다 — 이 스택이 자기 redis-community 를 띄운다.
# 남은 공유 자원은 Postgres 인스턴스(계정까지 공유)와 JWT 대칭키다. 각각 DB 계정 분리와
# JWT 비대칭 전환으로 끊을 차례이며, 그때까지는 "분리된 서비스"라고 부르기 어렵다.
#
# 실행:  docker compose --env-file /opt/planmate-v2/.env -f docker-compose.community.yml up -d
#   (--env-file 로 POSTGRES_USER/PASSWORD/JWT_SECRET/CORS_ALLOWED_ORIGINS 를 v2 .env에서 그대로 가져옴 → 시크릿 공유)
#
# CI/CD: main push → GitHub Actions 가 cycle123/planmate-community:latest 를 Docker Hub 에 push,
#        docker53 의 Watchtower(WATCHTOWER_LABEL_ENABLE) 가 아래 라벨을 보고 자동 pull+재기동.
# 전제: planmate-postgres 안에 'community' DB가 존재해야 함 (Flyway가 테이블/pg_trgm 생성).
services:
  community:
    image: cycle123/planmate-community:latest
    container_name: planmate-community
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://planmate-postgres:5432/community
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis: 이 서비스 전용(아래 redis-community). 예전에는 v2의 planmate-redis 를
      # 같이 썼는데, 거기엔 SharedSync 협업편집의 presence/history 런타임 상태가 산다.
      # 커뮤니티 캐시 트래픽이 얹히면 eviction 이 그 세션 상태를 날릴 수 있었다.
      SPRING_DATA_REDIS_HOST: redis-community
      SPRING_DATA_REDIS_PORT: "6379"
      # 주의: MINIO_PUBLIC_URL 과 같은 이유로 ${} 치환을 쓰지 않는다. --env-file 로 읽는
      #       /opt/planmate-v2/.env 에 REDIS_PASSWORD 가 있으면 그 값이 새어들어와,
      #       비밀번호가 없는 redis-community 에 AUTH 를 시도하다 기동이 깨진다.
      REDIS_PASSWORD: ""
      # JWT: v2 페어링 (raw UTF-8). v2 .env의 JWT_SECRET 그대로 공유
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_ENCODING: raw
      # 내부 유저 API: v2의 gRPC 서버(9090). 컨테이너 간 통신이라 호스트 publish/nginx 노출 불필요.
      # 전제: /opt/planmate-v2 의 planmate-app 이 9090 을 열고 있어야 한다.
      # 붙지 못해도 닉네임은 게시글 스냅샷으로 fallback 하므로 읽기는 계속 동작한다.
      MAIN_BACKEND_GRPC: static://planmate-app:9090
      INTERNAL_API_TOKEN: local-internal-token
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # MINIO: 별도 호스트(192.168.0.90)에 있다. 자격증명은 --env-file 로 주입.
      #   ENDPOINT   = 서버→MinIO 내부 통신. 사설 IP 그대로 둔다.
      #   PUBLIC_URL = 브라우저가 이미지를 받아오는 주소. 업로드 시점에 DB에 절대 URL로
      #                박히므로(ImageService#upload) 반드시 외부에서 닿는 https 도메인이어야 한다.
      #                사설 IP를 넣으면 외부 접속 불가 + https 페이지에서 mixed content 차단.
      #
      # 주의: PUBLIC_URL 만 ${} 치환을 쓰지 않는다. --env-file 로 읽는 /opt/planmate-v2/.env 는
      #       Backend-v2 와 공유하는 파일이라 거기에 MINIO_PUBLIC_URL 이 들어있으면
      #       ${MINIO_PUBLIC_URL:-...} 의 기본값이 조용히 덮여버린다(:- 는 "미설정"일 때만 적용).
      #       실제로 그 파일의 사설 IP 값이 새어들어와 외부에서 이미지가 안 보이는 사고가 났다.
      #       외부 도메인은 비밀값이 아니므로 여기에 고정해 공유 .env 가 못 건드리게 한다.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://192.168.0.90:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: community
      MINIO_PUBLIC_URL: https://minio.bapdodi.cloud
    ports:
      - "8081:8081"
    networks:
      - planmate-v2_default
    depends_on:
      - redis-community

  # 커뮤니티 전용 Redis. 호스트에 publish 하지 않는다 — 이 스택 안에서만 쓴다.
  redis-community:
    image: redis:7-alpine
    container_name: planmate-community-redis
    restart: unless-stopped
    # maxmemory-policy 를 volatile-lru 로 두는 게 핵심이다.
    #   community:user:*        캐시. TTL 10분/1분. 날아가도 다시 조회하면 그만.
    #   community:view:delta:*  캐시가 아니다. 아직 DB 에 안 들어간 조회수 버퍼로,
    #   community:view:dirty    TTL 이 없고 10초 주기로 flush 된다(ViewCountService).
    # allkeys-lru 로 두면 메모리가 차는 순간 이 버퍼가 지워져 조회수가 조용히 사라진다.
    # volatile-lru 는 TTL 이 붙은 키만 지우므로 정확히 캐시만 버리고 버퍼는 남긴다.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save ""
      --appendonly no
    # 볼륨을 두지 않는다. 재기동 시 캐시는 다시 채워지고, 유실되는 것은 마지막 flush 이후
    # 10초치 조회수뿐이다 — ViewCountService 가 이미 유실을 허용하도록 쓰여 있다.
    networks:
      - planmate-v2_default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  planmate-v2_default:
    external: true
